```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İyi ki Doğdun Duru ❤️</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.kutu {
    background: rgba(255,255,255,0.9);
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    width: 80%;
    max-width: 500px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
    color: #ff4d6d;
    font-size: 38px;
}

p {
    color: #555;
    font-size: 19px;
    line-height: 1.6;
}

.kalp {
    position: absolute;
    font-size: 25px;
    animation: uc 5s linear infinite;
}

@keyframes uc {
    from {
        transform: translateY(100vh);
        opacity: 1;
    }
    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="kutu">
    <h1>İyi ki Doğdun Duru! ❤️</h1>

    <p>
        İyi ki doğdun güzelim. 🎂❤️
        <br><br>
        Umarım yeni yaşın sana bol bol mutluluk,
        güzel anılar ve kahkaha getirir.
        <br><br>
        Seni çok seviyorum. 💕
    </p>
</div>

<script>
function kalpOlustur() {
    const kalp = document.createElement("div");
    kalp.className = "kalp";
    kalp.innerHTML = "❤️";
    kalp.style.left = Math.random() * 100 + "vw";
    kalp.style.animationDuration = (3 + Math.random() * 4) + "s";
    document.body.appendChild(kalp);

    setTimeout(() => {
        kalp.remove();
    }, 7000);
}

setInterval(kalpOlustur, 400);
</script>

</body>
</html>
```
