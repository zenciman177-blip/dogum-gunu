```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duru ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.kart {
    width: 90%;
    max-width: 520px;
    background: rgba(255,255,255,0.94);
    padding: 35px 25px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

h1 {
    color: #ff3f68;
    font-size: 38px;
}

p {
    color: #555;
    font-size: 18px;
    line-height: 1.6;
}
.foto {
    width: 100%;
    max-width: 350px;
    border-radius: 20px;
    margin: 15px 0 20px;
}
button {
    border: none;
    background: #ff3f68;
    color: white;
    padding: 15px 25px;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}

#mesaj {
    display: none;
    margin-top: 25px;
    color: #ff3f68;
    font-size: 20px;
    font-weight: bold;
}

.kalp {
    position: fixed;
    bottom: -30px;
    font-size: 25px;
    animation: yukari 5s linear forwards;
    pointer-events: none;
}

@keyframes yukari {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="kart">

    <div style="font-size:55px;">🎂</div>

    <h1>İyi ki Doğdun Duru! ❤️</h1>
<img src="duru.jpeg" alt="Duru" class="foto">
    <p>
        Bugün senin günün. ✨<br>
        Umarım yeni yaşında her şey gönlünce olur
        ve yüzün hep güler.
    </p>

    <button onclick="surpriz()">🎁 Sürprizine Tıkla</button>

    <div id="mesaj">
        İyi ki hayatımdasın Duru. ❤️<br><br>
        Nice güzel yaşlara birlikte! 🥰
    </div>

</div>

<script>
function surpriz() {
    document.getElementById("mesaj").style.display = "block";

    for (let i = 0; i < 25; i++) {
        setTimeout(() => {
            let kalp = document.createElement("div");
            kalp.className = "kalp";
            kalp.innerHTML = "❤️";
            kalp.style.left = Math.random() * 100 + "vw";
            kalp.style.fontSize = (20 + Math.random() * 30) + "px";

            document.body.appendChild(kalp);

            setTimeout(() => {
                kalp.remove();
            }, 5000);
        }, i * 80);
    }
}
</script>

</body>
</html>
